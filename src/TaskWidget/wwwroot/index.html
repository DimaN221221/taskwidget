  lvlBtn.addEventListener("click", () => (profilePanel.hidden ? openProfile() : closeProfile()));
  $("profileClose").addEventListener("click", () => closeProfile());
  profilePanel.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProfile(); });
  document.addEventListener("pointerdown", (e) => {
    if (!profilePanel.hidden && !profilePanel.contains(e.target) && !lvlBtn.contains(e.target)
        && !$("toast").contains(e.target)) closeProfile(false);
  });

  // ---------- theme ----------
  const themes =["auto", "light", "dark"];
  const themeNames = { auto: "як у системі", light: "світла", dark: "темна" };
  function applyTheme() {
    if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.dataset.theme = state.theme;
    $("themeBtn").title = "Тема: " + themeNames[state.theme];
    postThemeColors();
  }
  // the native window paints a thin frame around the page, keep it in the page colours
  // (on Android: status/navigation bars follow the page colours)
  function postThemeColors() {
    const css = getComputedStyle(document.documentElement);
    const bg = css.getPropertyValue("--bg").trim();
    post("theme", { bg, line: css.getPropertyValue("--line").trim() });
    if (android) android.setTheme(bg, css.colorScheme === "dark");
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", postThemeColors);
  $("themeBtn").addEventListener("click", () => {
    state.theme = themes[(themes.indexOf(state.theme) + 1) % themes.length];
    applyTheme();
    save();
  });

  // ---------- window controls (only inside the widget) ----------
  function initWindowControls() {
    ["pinBtn", "minBtn", "closeBtn"].forEach(id => $(id).hidden = false);
    const pin = $("pinBtn");
    const setPin = (v) => { pin.setAttribute("aria-pressed", String(v)); };
    setPin(state.onTop);
    if (state.onTop) post("onTop", { value: true });
    pin.addEventListener("click", () => {
      state.onTop = !state.onTop;
      setPin(state.onTop);
      post("onTop", { value: state.onTop });
      save();
    });
    $("minBtn").addEventListener("click", () => post("minimize"));
    $("closeBtn").addEventListener("click", () => { flushSave(); post("close"); });

    // drag the window by the title bar (but not by its buttons)
    document.querySelector(".bar").addEventListener("mousedown", (e) => {
      if (e.button === 0 && !e.target.closest("button")) post("drag");
    });
  }

  // ---------- cloud sync (Supabase) ----------
  // Every device talks to the cloud on its own, so the PC doesn't need to be on.
  // Upload: tasks changed here (`dirty`). Download: rows the server changed since `cursor`.
  // The server keeps whichever version of a task has the larger `u` (see supabase/schema.sql).
  const CLOUD = window.TASKS_CLOUD && window.TASKS_CLOUD.url && window.TASKS_CLOUD.anonKey
    ? { url: window.TASKS_CLOUD.url.replace(/\/+$/, ""), anonKey: window.TASKS_CLOUD.anonKey } : null;
  const SESSION_KEY = "day-tasks-session";
  let session = null;   // { access_token, refresh_token, expires_at (s), user: { id, email } }
  let cloudState = "off", cloudError = "", lastCloudSync = 0;
  let cloudTimer = null, cloudBusy = false, cloudAgain = false;

  const clock = (ms) => new Date(ms).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });

  class CloudError extends Error {
    constructor(message, status, auth = false) { super(message); this.status = status; this.auth = auth; }
  }

  // AbortSignal.timeout is missing in older Android WebViews
  function timeoutSignal(ms) {
    if (typeof AbortSignal.timeout === "function") return AbortSignal.timeout(ms);
    const controller = new AbortController();
    setTimeout(() => controller.abort(), ms);
    return controller.signal;
  }
  // no connection / server unreachable / timed out — as opposed to a bug
  const isNetworkError = (e) => !!e && (e.name === "AbortError" || e.name === "TimeoutError"
    || (e.name === "TypeError" && /fetch|network|load failed/i.test(e.message)));
  const errorText = (e) => (e && e.name ? `${e.name}: ${e.message}` : String(e));

  function loadSession() {
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch { session = null; }
  }
  function storeSession(s) {
    session = s;
    try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch { }
  }
  const sessionFrom = (d) => ({
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
    user: { id: d.user.id, email: d.user.email },
  });

  function authMessage(d, status) {
    const raw = `${d.error_code || ""} ${d.msg || ""} ${d.error_description || ""} ${d.message || ""}`.toLowerCase();
    if (raw.includes("invalid login") || raw.includes("invalid_credentials")) return "Неправильна пошта або пароль";
    if (raw.includes("not confirmed")) return "Пошту ще не підтверджено — відкрийте лист від Supabase";
    if (raw.includes("already registered") || raw.includes("user_already_exists")) return "Такий акаунт уже є — просто увійдіть";
    if (raw.includes("password") && raw.includes("6")) return "Пароль має бути щонайменше з 6 символів";
    if (raw.includes("email") && raw.includes("invalid")) return "Перевірте адресу пошти";
    if (status === 429) return "Забагато спроб — зачекайте хвилину";
    return d.msg || d.error_description || d.message || `Помилка ${status}`;
  }

  async function authRequest(path, body) {
    const res = await fetch(`${CLOUD.url}/auth/v1/${path}`, {
      method: "POST",
      headers: { apikey: CLOUD.anonKey, "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: timeoutSignal(15000),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new CloudError(authMessage(data, res.status), res.status, true);
    return data;
  }

  async function accessToken(forceRefresh = false) {
    if (!forceRefresh && session.expires_at - 60 > Date.now() / 1000) return session.access_token;
    const d = await authRequest("token?grant_type=refresh_token", { refresh_token: session.refresh_token });
    storeSession(sessionFrom(d));
    return session.access_token;
  }

  async function rest(path, { method = "GET", body, prefer } = {}, retry = true) {
    const headers = { apikey: CLOUD.anonKey, Authorization: `Bearer ${await accessToken()}` };
    if (body) headers["Content-Type"] = "application/json";
    if (prefer) headers.Prefer = prefer;
    const res = await fetch(`${CLOUD.url}/rest/v1/${path}`, {
      method, headers, body: body && JSON.stringify(body), cache: "no-store", signal: timeoutSignal(20000),
    });
    if (res.status === 401 && retry) {
      await accessToken(true);
      return rest(path, { method, body, prefer }, false);
    }
    if (!res.ok) {
      const text = await res.text().catch(() => "");
      const msg = /relation|does not exist|schema cache/i.test(text)
        ? "У базі немає таблиці tasks — виконайте supabase/schema.sql"
        : `Сервер відповів ${res.status}`;
      throw new CloudError(msg, res.status);
    }
    // uploads (Prefer: return=minimal) come back with an empty body, whatever the status code
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  function scheduleCloudSync(ms) {
    if (!CLOUD || !session) return;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(cloudSync, ms);
  }

  async function cloudSync() {
    if (!CLOUD) return setCloudState("off");
    if (!session) return setCloudState("signedout");
    if (cloudBusy) { cloudAgain = true; return; }
    cloudBusy = true;
    clearTimeout(cloudTimer);
    setCloudState("busy");
    try {
      flushSync();

      // 1) upload what changed here
      const sent = [...dirty].map(id => state.items[id]).filter(Boolean);
      for (let i = 0; i < sent.length; i += 500) {
        await rest("tasks?on_conflict=user_id,id", {
          method: "POST",
          prefer: "resolution=merge-duplicates,return=minimal",
          body: sent.slice(i, i + 500).map(t => ({ user_id: session.user.id, id: t.id, data: t, u: t.u })),
        });
      }
      // forget only what wasn't changed again while we were uploading
      for (const t of sent) if (state.items[t.id] && state.items[t.id].u === t.u) dirty.delete(t.id);

      // 2) download what changed on the server (a few seconds of overlap: rows can commit out of order)
      let since = state.cursor ? new Date(Date.parse(state.cursor) - 5000).toISOString() : null;
      const incoming = {};
      for (;;) {
        const filter = since ? `&updated_at=gt.${encodeURIComponent(since)}` : "";
        const rows = await rest(`tasks?select=id,data,updated_at&order=updated_at.asc&limit=1000${filter}`);
        for (const r of rows) {
          incoming[r.id] = r.data;
          if (!state.cursor || r.updated_at > state.cursor) state.cursor = r.updated_at;
        }
        if (rows.length < 1000) break;
        since = rows[rows.length - 1].updated_at;
      }
      for (const [id, t] of Object.entries(incoming)) {
        if (dirty.has(id) && (t.u || 0) >= (state.items[id]?.u || 0)) dirty.delete(id);
      }
      mergeItems(incoming);
      flushSave();

      lastCloudSync = Date.now();
      cloudError = "";
      setCloudState("ok");
    } catch (e) {
      if (e instanceof CloudError && e.auth) {
        storeSession(null);
        cloudError = "Сесія завершилась — увійдіть знову";
        setCloudState("signedout");
      } else if (e instanceof CloudError) {
        cloudError = e.message;
        setCloudState("error");
      } else if (isNetworkError(e)) {
        cloudError = `Немає зв'язку з сервером синхронізації (${e.name}: ${e.message})`;
        setCloudState("offline");
      } else {
        // a bug or an unsupported browser feature — show it as it is, not as "no internet"
        cloudError = `Збій синхронізації: ${errorText(e)}`;
        console.error(e);
        setCloudState("error");
      }
    } finally {
      cloudBusy = false;
      if (cloudAgain) { cloudAgain = false; scheduleCloudSync(300); }
    }
  }

  async function signIn(email, password) {
    storeSession(sessionFrom(await authRequest("token?grant_type=password", { email, password })));
    afterSignIn();
  }
  // true: signed in right away; false: Supabase sent a confirmation e-mail first
  async function signUp(email, password) {
    const d = await authRequest("signup", { email, password });
    if (!d.access_token) return false;
    storeSession(sessionFrom(d));
    afterSignIn();
    return true;
  }
  function afterSignIn() {
    // first sync for this account: send everything we have, fetch everything it has
    state.cursor = null;
    Object.keys(state.items).forEach(id => dirty.add(id));
    cloudError = "";
    save();
    cloudSync();
  }
  function signOut() {
    const old = session;
    storeSession(null);
    dirty.clear();
    state.cursor = null;
    save();
    setCloudState("signedout");
    if (old) {
      fetch(`${CLOUD.url}/auth/v1/logout`, {
        method: "POST", headers: { apikey: CLOUD.anonKey, Authorization: `Bearer ${old.access_token}` },
      }).catch(() => {});
    }
  }

  // ---------- cloud: status button and panel ----------
  const syncBtn = $("syncBtn"), syncPanel = $("syncPanel");

  function setCloudState(s) {
    cloudState = s;
    syncBtn.dataset.state = s;
    const label = {
      off: "хмару не налаштовано",
      signedout: "не виконано вхід",
      busy: "синхронізація…",
      ok: `синхронізовано ${clock(lastCloudSync)}`,
      offline: lastCloudSync ? `офлайн · ${clock(lastCloudSync)}` : "немає інтернету",
      error: "помилка синхронізації",
    }[s];
    $("syncText").textContent = "· " + label;
    syncBtn.title = cap(label) + (s === "offline" ? ". Зміни збережено на пристрої." : "");
    if (!syncPanel.hidden) renderSyncPanel();
  }

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  function renderSyncPanel() {
    const body = $("syncBody");
    if (!CLOUD) {
      body.replaceChildren(el("p", { className: "muted",
        textContent: "Хмару ще не підключено: у файлі cloud-config.js немає адреси й ключа проєкту Supabase." }));
      return;
    }
    if (!session) {
      const email = el("input", { type: "email", id: "cloudEmail", autocomplete: "username", required: true, inputMode: "email" });
      const pass = el("input", { type: "password", id: "cloudPass", autocomplete: "current-password", required: true, minLength: 6 });
      const error = el("p", { className: "panel-error", textContent: cloudError, hidden: !cloudError });
      error.setAttribute("role", "alert");
      const signInBtn = el("button", { className: "add-btn", type: "submit", textContent: "Увійти" });
      const signUpBtn = el("button", { className: "link-btn", type: "button", textContent: "Створити акаунт" });

      const run = async (action) => {
        if (!form.reportValidity()) return;
        signInBtn.disabled = signUpBtn.disabled = true;
        error.hidden = true;
        try {
          if (action === "up" && !(await signUp(email.value.trim(), pass.value))) {
            body.replaceChildren(el("p", { className: "muted",
              textContent: `Надіслали лист на ${email.value.trim()}. Підтвердьте адресу за посиланням із листа, потім увійдіть тут.` }));
            setTimeout(() => { if (!syncPanel.hidden && !session) renderSyncPanel(); }, 8000);
            return;
          }
          if (action === "in") await signIn(email.value.trim(), pass.value);
        } catch (e) {
          error.textContent = e instanceof CloudError ? e.message
            : isNetworkError(e) ? `Немає зв'язку з сервером (${e.name}: ${e.message})`
            : `Збій: ${errorText(e)}`;
          if (!(e instanceof CloudError) && !isNetworkError(e)) console.error(e);
          error.hidden = false;
          signInBtn.disabled = signUpBtn.disabled = false;
          pass.focus();
        }
      };
      const form = el("form", { className: "cloud-form", noValidate: false },
        el("p", { className: "muted", textContent: "Увійдіть однаковим акаунтом на ПК і телефоні — задачі будуть спільні." }),
        el("label", { htmlFor: "cloudEmail", textContent: "Пошта" }), email,
        el("label", { htmlFor: "cloudPass", textContent: "Пароль" }), pass,
        error,
        el("div", { className: "form-actions" }, signInBtn, signUpBtn));
      form.addEventListener("submit", (e) => { e.preventDefault(); run("in"); });
      signUpBtn.addEventListener("click", () => run("up"));
      body.replaceChildren(form);
      return;
    }
    const status = {
      busy: "Синхронізація…",
      ok: `Синхронізовано о ${clock(lastCloudSync)}`,
      offline: `Зміни збережено тут і підуть у хмару, щойно з'явиться зв'язок. ${cloudError}`,
      error: cloudError,
    }[cloudState] || "";
    body.replaceChildren(
      el("p", { className: "muted" }, "Акаунт: ", el("strong", { textContent: session.user.email })),
      el("p", { className: cloudState === "error" ? "panel-error" : "muted", textContent: status }),
      el("div", { className: "form-actions" },
        el("button", { className: "add-btn", type: "button", textContent: "Синхронізувати", onclick: cloudSync,
                       disabled: cloudState === "busy" }),
        el("button", { className: "link-btn", type: "button", textContent: "Вийти", onclick: signOut })));
  }

  function openSyncPanel() {
    closeCalendar(false);
    closeMoveMenu(false);
    closeProfile(false);
    const top = document.querySelector("header").getBoundingClientRect().bottom - 6;
    syncPanel.style.top = `${top}px`;
    syncPanel.style.setProperty("--panel-top", `${top}px`);
    syncPanel.hidden = false;
    syncBtn.setAttribute("aria-expanded", "true");
    renderSyncPanel();
    (syncPanel.querySelector("#cloudEmail") || $("syncClose")).focus();
  }
  function closeSyncPanel(returnFocus = true) {
    if (syncPanel.hidden) return;
    syncPanel.hidden = true;
    syncBtn.setAttribute("aria-expanded", "false");
    if (returnFocus) syncBtn.focus();
  }

  function initCloud() {
    loadSession();
    syncBtn.addEventListener("click", () => (syncPanel.hidden ? openSyncPanel() : closeSyncPanel()));
    $("syncClose").addEventListener("click", () => closeSyncPanel());
    syncPanel.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSyncPanel(); });
    document.addEventListener("pointerdown", (e) => {
      if (!syncPanel.hidden && !syncPanel.contains(e.target) && !syncBtn.contains(e.target)) closeSyncPanel(false);
    });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") cloudSync(); });
    addEventListener("online", cloudSync);
    setInterval(() => { if (document.visibilityState === "visible") cloudSync(); }, 60_000);
    cloudSync();
  }

  // ---------- updates from GitHub Releases ----------
  // The host (PC widget or Android app) tells its version and which release file is its own;
  // the page asks GitHub for the latest release and offers it when it is newer.
  // Downloading, the SHA-256 check and installing are the host's job (Updater.cs / Updater.java),
  // which reports back through window.taskWidgetUpdate({ state, pct?, message? }).
  const UPDATE_EVERY = 6 * 3600e3;
  const updateHost = (() => {
    if (window.taskWidgetHost && window.taskWidgetHost.version) return window.taskWidgetHost;
    try { return android && android.updateInfo ? JSON.parse(android.updateInfo()) : null; } catch { return null; }
  })();
  let release = null;          // { version, url, sha } of a newer release
  let updateDismissed = null;  // version hidden with × until the app restarts

  const versionParts = (v) => [...String(v).replace(/^v/i, "").split(".").map(n => parseInt(n, 10) || 0), 0, 0, 0].slice(0, 3);
  function isNewer(a, b) {
    const x = versionParts(a), y = versionParts(b);
    for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i];
    return false;
  }

  async function checkUpdate() {
    if (!updateHost) return;
    try {
      const res = await fetch(`https://api.github.com/repos/${updateHost.repo}/releases/latest`,
        { headers: { Accept: "application/vnd.github+json" }, cache: "no-store", signal: timeoutSignal(15000) });
      if (!res.ok) return;
      const r = await res.json();
      const asset = (name) => (r.assets || []).find(a => a.name === name);
      const file = asset(updateHost.asset), sum = asset(updateHost.asset + ".sha256");
      const version = String(r.tag_name || "").replace(/^v/i, "");
      if (!file || !sum || !isNewer(version, updateHost.version)) return;
      release = { version, url: file.browser_download_url, sha: sum.browser_download_url };
      if (version !== updateDismissed && $("updateBtn").disabled === false) showUpdate(`Доступна версія ${version}`, "Оновити");
    } catch { /* offline or GitHub is slow: next time */ }
  }

  // label: text of the button, or null to disable it (while downloading)
  function showUpdate(text, label) {
    $("updateText").textContent = text;
    $("updateBtn").disabled = !label;
    if (label) $("updateBtn").textContent = label;
    $("updateBar").hidden = false;
  }

  function installUpdate() {
    if (!release) return;
    showUpdate("Завантаження…", null);
    if (host) {
      flushSave(); // the widget restarts as soon as the new exe is in place
      post("update", { url: release.url, sha: release.sha });
    } else {
      android.installUpdate(release.url, release.sha);
    }
  }

  window.taskWidgetUpdate = (s) => {
    if (s.state === "progress") showUpdate(`Завантаження… ${s.pct}%`, null);
    else if (s.state === "restarting") showUpdate("Перезапуск…", null);
    else if (s.state === "installing") showUpdate(`Підтвердіть встановлення версії ${release.version}`, "Встановити");
    else if (s.state === "permission") showUpdate("Дозвольте встановлювати застосунки з «Задачі» й поверніться сюди", "Оновити");
    else if (s.state === "error") showUpdate(s.message || "Не вдалося оновити", "Ще раз");
  };

  $("updateBtn").addEventListener("click", installUpdate);
  $("updateClose").addEventListener("click", () => {
    $("updateBar").hidden = true;
    updateDismissed = release && release.version;
  });

  function initUpdates() {
    if (!updateHost) return; // plain browser: nothing to update
    setTimeout(checkUpdate, 5000);
    setInterval(checkUpdate, UPDATE_EVERY);
  }

  // ---------- Android app ----------
  // Back button: close whatever is open first; returns true if it handled the press.
  window.taskWidgetBack = () => {
    if (menuFor) { closeMoveMenu(); return true; }
    if (!$("cal").hidden) { closeCalendar(); return true; }
    if (!syncPanel.hidden) { closeSyncPanel(); return true; }
    if (!profilePanel.hidden) { closeProfile(); return true; }
    if (list.contains(document.activeElement) && document.activeElement.isContentEditable) {
      document.activeElement.blur();
      return true;
    }
    if (view !== today) { goTo(today); return true; }
    return false;
  };

  function start() {
    load();
    applyTheme();
    renderHeader();
    sync();
    if (host) {
      initWindowControls();
      flushSave(); // hand the (possibly just migrated) tasks to the host right away
    }
    if (android) $("syncText").hidden = false; // room for the status text on a phone
    initCloud();
    initUpdates();
    if (matchMedia("(pointer: coarse)").matches) {
      $("editHint").textContent = "Двічі торкніться — редагувати";
    } else {
      input.focus(); // on a touch screen this would pop up the keyboard on every launch
    }

    // past midnight: "today" moves on; if you were looking at today, follow it
    setInterval(() => {
      const now = keyOf(new Date());
      if (now === today) return;
      const wasOnToday = view === today;
      today = now;
      if (wasOnToday) goTo(now);
      renderHeader();
      renderProgress();
    }, 60_000);
  }

  start();
})();
</script>
</body>
</html>
