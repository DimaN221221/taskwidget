<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачі на день</title>
<!-- Supabase project address and public key for sync (window.TASKS_CLOUD) -->
<script src="cloud-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --text: #1C2321;
    --text-muted: #5E6763;
    --line: #E4E2DA;
    --primary: #0D7D72;
    --primary-soft: #DDEFEC;
    --on-primary: #FFFFFF;
    --accent: #C2410C;
    --danger: #B42318;
    --done-text: #8A918E;
    --ring: #0D7D72;
    --shadow: 0 1px 0 rgba(28, 35, 33, .04);
    --radius: 10px;
    --font: "Plus Jakarta Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161A19;
      --surface: #1F2523;
      --text: #ECEFEC;
      --text-muted: #A3ABA7;
      --line: #2E3532;
      --primary: #3CB4A6;
      --primary-soft: #1D3A36;
      --on-primary: #0B1312;
      --accent: #F28A4B;
      --danger: #F2847A;
      --done-text: #6F7874;
      --ring: #3CB4A6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161A19;
    --surface: #1F2523;
    --text: #ECEFEC;
    --text-muted: #A3ABA7;
    --line: #2E3532;
    --primary: #3CB4A6;
    --primary-soft: #1D3A36;
    --on-primary: #0B1312;
    --accent: #F28A4B;
    --danger: #F2847A;
    --done-text: #6F7874;
    --ring: #3CB4A6;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 15px/1.45 var(--font);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Title bar ---------- */
  .bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 6px 0 16px;
    min-height: 40px;
    user-select: none;
  }
  .bar-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .icon-btn {
    width: 32px; height: 32px;
    display: inline-grid; place-items: center;
    border: 0; background: transparent;
    border-radius: 8px;
    color: var(--text-muted);
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .icon-btn:hover { background: var(--line); color: var(--text); }
  .icon-btn[aria-pressed="true"] { color: var(--primary); }
  .icon-btn.close:hover { background: var(--danger); color: #fff; }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- Header ---------- */
  header { padding: 4px 16px 14px; }
  .day-nav {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .date {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.2;
  }
  .date-btn {
    display: block;
    max-width: 100%;
    margin: -4px 0 -4px -8px;
    padding: 4px 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    font: inherit;
    color: inherit;
    letter-spacing: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color .15s;
  }
  .date-btn:hover { background: var(--line); }
  .date-main { display: inline-flex; align-items: center; gap: 6px; }
  .date-main svg {
    width: 16px; height: 16px;
    color: var(--text-muted);
    transition: transform .2s;
  }
  .date-btn[aria-expanded="true"] .date-main svg { transform: rotate(180deg); }
  .today-btn {
    height: 28px;
    margin-right: 4px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    cursor: pointer;
    transition: background-color .15s;
  }
  .today-btn:hover { background: var(--primary-soft); }

  /* ---------- Calendar and phone panel (floating cards) ---------- */
  .cal, .panel {
    position: absolute;
    left: 12px; right: 12px;
    z-index: 10;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .16);
  }
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .cal-title { font-size: 14px; font-weight: 600; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-wd {
    padding: 4px 0;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .cal-day {
    position: relative;
    height: 34px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: 500 13px/1 var(--font);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background-color .12s;
  }
  .cal-day:hover { background: var(--line); }
  .cal-day.out { color: var(--text-muted); }
  .cal-day.today { color: var(--primary); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--primary); }
  .cal-day.selected { background: var(--primary); color: var(--on-primary); }
  /* dot = something planned that day; muted when everything is done */
  .cal-day.has::after {
    content: "";
    position: absolute;
    left: 50%; bottom: 4px;
    width: 4px; height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: var(--primary);
  }
  .cal-day.has.all-done::after { background: var(--text-muted); }
  .cal-day.selected::after { background: var(--on-primary); }

  /* ---------- Carry over unfinished tasks from a past day ---------- */
  .carry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 8px;
    padding: 6px 6px 6px 12px;
    border-radius: 10px;
    background: var(--primary-soft);
    font-size: 13px;
  }
  .carry button {
    flex: none;
    height: 30px;
    padding: 0 10px;
    border: 0;
    border-radius: 7px;
    background: var(--primary);
    color: var(--on-primary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  /* ---------- Update available (above the footer) ---------- */
  .update {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 12px 8px;
    padding: 4px 4px 4px 12px;
    border-radius: 10px;
    background: var(--primary-soft);
    font-size: 13px;
  }
  .update span { flex: 1; min-width: 0; }
  .update .add-btn { flex: none; height: 30px; font-size: 12px; }
  .update .icon-btn { flex: none; }
  .date small {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0;
  }
  .progress {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .track {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 100%;
    background: var(--primary);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform .3s cubic-bezier(.2, .7, .2, 1);
  }

  /* ---------- Add form ---------- */
  .add {
    margin: 0 12px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 4px 4px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    transition: border-color .15s;
  }
  .add:focus-within { border-color: var(--primary); }
  .add input {
    flex: 1;
    min-width: 0;
    height: 36px;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    outline: none;
  }
  .add input::placeholder { color: var(--text-muted); }
  .add-btn {
    height: 36px;
    padding: 0 12px;
    border: 0;
    border-radius: 7px;
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    transition: opacity .15s;
  }
  .add-btn:disabled { opacity: .45; cursor: default; }
  .add-btn svg { width: 14px; height: 14px; }

  /* ---------- List ---------- */
  main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 12px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 4px 6px 6px;
    border-radius: 8px;
    transition: background-color .15s;
  }
  .task:hover, .task:focus-within { background: var(--surface); }
  .task + .task { margin-top: 2px; }

  /* checkbox: 44px hit area via label padding, 20px visual box */
  .check {
    position: relative;
    flex: none;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .check input {
    position: absolute; inset: 0;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .box {
    width: 20px; height: 20px;
    border: 1.5px solid var(--text-muted);
    border-radius: 6px;
    display: grid; place-items: center;
    transition: background-color .15s, border-color .15s;
  }
  .box svg {
    width: 14px; height: 14px;
    stroke: var(--on-primary);
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .2s ease-out .05s;
  }
  .check:hover .box { border-color: var(--primary); }
  .check input:focus-visible + .box { outline: 2px solid var(--ring); outline-offset: 2px; }
  .check input:checked + .box { background: var(--primary); border-color: var(--primary); }
  .check input:checked + .box svg { stroke-dashoffset: 0; }

  .text {
    flex: 1;
    min-width: 0;
    padding: 5px 0;
    overflow-wrap: anywhere;
    cursor: text;
  }
  /* strike line drawn as background so it can animate across wrapped lines */
  .text span {
    background: linear-gradient(currentColor, currentColor) 0 58% / 0 1.5px no-repeat;
    transition: background-size .25s ease-out, color .2s;
  }
  .task.done .text span {
    color: var(--done-text);
    background-size: 100% 1.5px;
  }
  .text[contenteditable="true"] {
    outline: none;
    background: var(--bg);
    border-radius: 6px;
    padding: 5px 6px;
    margin: 0 -6px;
    box-shadow: inset 0 0 0 1px var(--primary);
  }

  .del, .move {
    flex: none;
    opacity: 0;
    transition: opacity .15s, background-color .15s, color .15s;
  }
  .task:hover .del, .del:focus-visible,
  .task:hover .move, .move:focus-visible, .move[aria-expanded="true"] { opacity: 1; }
  .del:hover { color: var(--danger); background: transparent; }
  .move:hover, .move[aria-expanded="true"] { color: var(--primary); background: transparent; }
  .task .move + .del { margin-left: -6px; }

  /* ---------- Move menu ---------- */
  .menu {
    position: absolute;
    z-index: 12;
    min-width: 200px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
  }
  .menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 40px;
    padding: 0 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--line); outline: none; }
  .menu svg { flex: none; width: 16px; height: 16px; color: var(--text-muted); }
  .menu small { margin-left: auto; padding-left: 12px; font-size: 12px; color: var(--text-muted); }

  .cal-hint {
    margin: 0 2px 6px;
    font-size: 12px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-hint strong { color: var(--text); font-weight: 600; }
  /* the day the task is already on, while picking where to move it */
  .cal-day[aria-disabled="true"] {
    background: var(--line);
    color: var(--text-muted);
    box-shadow: none;
    cursor: default;
  }
  .cal-day[aria-disabled="true"]::after { background: var(--text-muted); }

  /* ---------- Toast (after moving a task) ---------- */
  .toast {
    position: absolute;
    left: 12px; right: 12px;
    bottom: calc(52px + env(safe-area-inset-bottom));
    z-index: 11;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 14px;
    border-radius: 10px;
    background: var(--text);
    color: var(--bg);
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
  }
  .toast span { flex: 1; min-width: 0; }
  .toast button {
    flex: none;
    height: 32px;
    padding: 0 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--bg);
    font-size: 13px;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .toast button:hover { background: rgba(127, 127, 127, .2); }

  /* ---------- Reordering ---------- */
  ul { position: relative; }
  .grip {
    flex: none;
    width: 20px; height: 32px;
    margin-right: -6px;
    display: grid; place-items: center;
    border: 0; padding: 0;
    background: transparent;
    border-radius: 6px;
    color: var(--text-muted);
    cursor: grab;
    touch-action: none;
    opacity: .35; /* always a hint that rows can be moved */
    transition: opacity .15s, color .15s;
  }
  .task.done .grip { opacity: .2; }
  .grip svg { width: 14px; height: 14px; }
  .task:hover .grip, .task .grip:focus-visible { opacity: 1; }
  .grip:hover { color: var(--text); }
  @media (hover: none) {
    .grip, .del, .move { opacity: .6 !important; }
  }

  .task.shifting { transition: transform .18s cubic-bezier(.2, .7, .2, 1), background-color .15s; }
  .task.dragging {
    position: relative;
    z-index: 2;
    background: var(--surface);
    box-shadow: 0 8px 20px rgba(0, 0, 0, .14), 0 0 0 1px var(--line);
  }
  .task.dragging .grip { opacity: 1; color: var(--primary); cursor: grabbing; }
  body.is-dragging { user-select: none; cursor: grabbing; }
  body.is-dragging .task:not(.dragging) { background: transparent; }

  .divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 6px 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ---------- Sync panel ---------- */
  .panel {
    max-height: calc(100vh - var(--panel-top, 120px) - 12px);
    overflow-y: auto;
    font-size: 13px;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -4px -4px 4px 2px;
  }
  .panel-head strong { font-size: 14px; }
  .muted { margin: 0 0 8px; color: var(--text-muted); }
  .muted strong { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
  .panel-error { margin: 0 0 8px; color: var(--danger); }
  .cloud-form label {
    display: block;
    margin: 8px 0 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .cloud-form input {
    display: block;
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  .cloud-form input:focus { border-color: var(--primary); }
  .cloud-form .panel-error { margin-top: 8px; }
  .form-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  .form-actions .link-btn { margin-right: 0; }
  .form-actions .link-btn:hover:not(:disabled) { color: var(--text); }

  /* ---------- Sync status ---------- */
  .sync-text {
    margin-left: 6px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
  }
  .sync-btn { position: relative; }
  .sync-btn::after {
    content: "";
    position: absolute;
    right: 6px; top: 6px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    box-shadow: 0 0 0 2px var(--bg);
  }
  .sync-btn[data-state="ok"]::after { background: var(--primary); }
  .sync-btn[data-state="signedout"]::after,
  .sync-btn[data-state="error"]::after { background: var(--danger); }
  .sync-btn[data-state="off"]::after { display: none; }
  .sync-btn[data-state="busy"] svg { animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: .35; } }

  /* ---------- Level chip (title bar) ---------- */
  .lvl-chip {
    position: relative;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    margin-right: 4px;
    padding: 0 10px 0 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    cursor: pointer;
    transition: background-color .15s;
  }
  .lvl-chip:hover, .lvl-chip[aria-expanded="true"] { background: var(--primary-soft); }
  /* XP towards the next level, along the bottom edge */
  .lvl-chip::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 2px;
    background: var(--primary);
    transform-origin: left;
    transform: scaleX(var(--p, 0));
    transition: transform .4s cubic-bezier(.2, .7, .2, 1);
  }
  .lvl-avatar { font-size: 14px; line-height: 1; }
  .lvl-streak { color: var(--accent); }

  /* ---------- Profile panel ---------- */
  .profile-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 2px 6px;
  }
  .avatar {
    flex: none;
    width: 52px; height: 52px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--primary-soft);
    font-size: 28px;
    line-height: 1;
  }
  .profile-top .info { flex: 1; min-width: 0; }
  .rank { font-size: 16px; font-weight: 700; }
  .lvl-line {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 2px;
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .xp-track {
    height: 6px;
    margin-top: 6px;
    border-radius: 3px;
    background: var(--line);
    overflow: hidden;
  }
  .xp-fill {
    height: 100%;
    background: var(--primary);
    transform-origin: left;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
  }
  .stat { padding: 8px 10px; border-radius: 8px; background: var(--bg); }
  .stat b {
    display: block;
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat span { font-size: 11px; color: var(--text-muted); }
  .section-title {
    display: flex;
    justify-content: space-between;
    margin: 14px 2px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .section-title span { letter-spacing: 0; text-transform: none; font-weight: 500; }
  /* activity heatmap: one column per week, Monday on top */
  .heat {
    display: grid;
    grid-template-rows: repeat(7, auto);
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 3px;
  }
  .heat i, .heat-legend i { aspect-ratio: 1; border-radius: 3px; background: var(--line); }
  .heat i.future { background: transparent; }
  .heat i.today { box-shadow: inset 0 0 0 1.5px var(--text-muted); }
  .heat i.l1, .heat i.l2, .heat i.l3, .heat i.l4,
  .heat-legend i.l1, .heat-legend i.l2, .heat-legend i.l3, .heat-legend i.l4 { background: var(--primary); }

  .ach.locked b { color: var(--text-muted); }
  .xp-hint { margin: 12px 2px 2px; font-size: 11px; color: var(--text-muted); }

  /* ---------- Rewards: floating XP and confetti ---------- */
  .xp-float {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    font-size: 12px;
    font-weight: 700;

  }
  .confetti {
    position: fixed;
    z-index: 20;
    width: 6px; height: 9px;
    margin: -4px 0 0 -3px;

  }

  /* ---------- Phone: notch / gesture bar and finger-sized targets ---------- */
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const list = $("list"), input = $("newTask"), addBtn = $("addBtn");
  const tpl = $("taskTpl");
  const STORE_KEY = "day-tasks-v1";

  // items: { id: { id, text, done, doneAt?: when ticked (ms), day: "YYYY-MM-DD", o: order, u: last change (ms), deleted? } }
  // Every change stamps `u`; two copies (PC, phone) merge per task — the newer `u` wins.
  // Deleted tasks stay as tombstones for a while so the deletion reaches the other device;
  // finished ones are kept for good in short form, because they still count towards XP.
  // seen: the level and achievements this device has already celebrated.
  let state = { items: {}, theme: "auto", onTop: false, seen: null };
  const TOMBSTONE_DAYS = 90;

  // ---------- dates (local time, keys like "2026-10-24") ----------
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dateOf = (key) => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (key, n) => { const d = dateOf(key); d.setDate(d.getDate() + n); return keyOf(d); };
  const dayDiff = (a, b) => Math.round((dateOf(a) - dateOf(b)) / 864e5);
  const cap = (s) => s[0].toUpperCase() + s.slice(1);

  let today = keyOf(new Date());
  let view = today; // the day on screen

  // ---------- where the data lives ----------
  // PC widget: saved by the WebView2 host into tasks.json;
  // Android app and plain browser: localStorage of the page.
  // Either way the cloud sync below keeps devices in step.
  const host = (window.chrome && window.chrome.webview) || null;
  const post = (type, extra = {}) => host && host.postMessage({ type, ...extra });
  const android = window.TaskWidgetAndroid || null; // bridge added by the Android app

  const dirty = new Set(); // ids changed on this device and not yet uploaded

  // tasks of one day: unfinished first, each group in the user's order
  function dayTasks(key) {
    return Object.values(state.items)
      .filter(t => !t.deleted && t.day === key)
      .sort((a, b) => (a.done - b.done) || (a.o - b.o) || (a.id < b.id ? -1 : 1));
  }

  function touch(task, patch) {
    Object.assign(task, patch);
    task.u = Math.max(Date.now(), (task.u || 0) + 1);
    dirty.add(task.id);
  }

  // turn any earlier save format into `items`
  function migrate(saved) {
    if (saved.items) return saved.items;
    const days = saved.days || (Array.isArray(saved.tasks) && saved.tasks.length ? { [today]: saved.tasks } : {});
    const items = {};
    const stamp = Date.now();
    for (const [day, tasks] of Object.entries(days)) {
      tasks.forEach((t, i) => { items[t.id] = { id: t.id, text: t.text, done: !!t.done, day, o: i, u: stamp }; });
    }
    return items;
  }

  function load() {
    let saved = null;
    try {
      saved = host
        ? window.taskWidgetHost && window.taskWidgetHost.initialState
        : JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    } catch (e) { console.warn("load failed", e); }
    if (saved) {
      state.items = migrate(saved);
      if (saved.theme) state.theme = saved.theme;
      state.onTop = !!saved.onTop;
      state.seen = saved.seen || null;
      if (saved.sync) {
        state.cursor = saved.sync.cursor || null;
        (saved.sync.dirty || []).forEach(id => dirty.add(id));
      }
    }

    // `state.tasks` = tasks of the day on screen, in display order (read-only snapshot)
    Object.defineProperty(state, "tasks", { get: () => dayTasks(view), enumerable: false });
  }

  function serialize() {
    const cutoff = Date.now() - TOMBSTONE_DAYS * 864e5;
    const items = {};
    for (const t of Object.values(state.items)) {
      if (!t.deleted || t.u > cutoff) items[t.id] = t;
      else if (t.done) items[t.id] = { id: t.id, done: true, doneAt: t.doneAt, day: t.day, o: t.o, u: t.u, deleted: true };
    }
    return {
      version: 2, items, theme: state.theme, onTop: state.onTop, seen: state.seen,
      sync: { cursor: state.cursor || null, dirty: [...dirty] }, // this device's progress with the cloud
    };
  }

  let saveTimer;
  function flushSave() {
    clearTimeout(saveTimer);
    try {
      if (host) post("save", { data: serialize() });
      else localStorage.setItem(STORE_KEY, JSON.stringify(serialize()));
    } catch (e) { console.warn("save failed", e); }
    if (dirty.size) scheduleCloudSync(1500);
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 150);
  }

  // Merge tasks from the cloud. Returns true if anything changed here.
  function mergeItems(incoming) {
    let changed = false;
    for (const [id, t] of Object.entries(incoming || {})) {
      const mine = state.items[id];
      if (!mine || (t.u || 0) > (mine.u || 0)) {
        state.items[id] = t;
        changed = true;
      }
    }
    if (changed) {
      sync({ animate: true });
      if (!$("cal").hidden) renderCalendar();
      markSeen(); // progress made on the other device was celebrated there
    }
    return changed;
  }

  // ---------- header ----------
  function dayMonth(key) {
    const d = dateOf(key);
    const text = d.toLocaleDateString("uk-UA", { day: "numeric", month: "long" });
    return d.getFullYear() === dateOf(today).getFullYear() ? text : `${text} ${d.getFullYear()}`;
  }

  function renderHeader() {
    const diff = dayDiff(view, today);
    const weekday = cap(dateOf(view).toLocaleDateString("uk-UA", { weekday: "long" }));
    const relative = { 0: "Сьогодні", 1: "Завтра", [-1]: "Вчора" }[diff];
    $("dateTitle").textContent = relative || weekday;
    $("dateSub").textContent = relative ? `${weekday.toLowerCase()}, ${dayMonth(view)}` : dayMonth(view);
    $("todayBtn").hidden = diff === 0;
    input.placeholder = diff === 0 ? "Що треба зробити?" : `Задача на ${dayMonth(view)}`;
  }

  const tasksWord = (n) =>
    n % 10 === 1 && n % 100 !== 11 ? "задача"
    : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "задачі"
    : "задач";

  function renderProgress() {
    const total = state.tasks.length;
    const done = state.tasks.filter(t => t.done).length;
    $("count").textContent = `${done} з ${total}`;
    $("fill").style.transform = `scaleX(${total ? done / total : 0})`;
    $("clearBtn").disabled = done === 0;

    const diff = dayDiff(view, today);
    $("empty").hidden = total > 0;
    $("emptyTitle").textContent = diff < 0 ? "У цей день задач не було" : "Список порожній";
    $("emptyText").textContent =
      diff === 0 ? "Додайте першу задачу на сьогодні"
      : diff > 0 ? "Додайте задачі, щоб спланувати цей день"
      : "Можна дописати їх заднім числом";

    const left = total - done;
    $("carry").hidden = !(diff < 0 && left > 0);
    $("carryText").textContent = `Невиконаних: ${left}`;
    renderGame();
  }

  // ---------- list ----------
  function makeItem(task) {
    const li = tpl.content.firstElementChild.cloneNode(true);
    li.dataset.id = task.id;
    li.classList.toggle("done", task.done);
    const cb = li.querySelector("input");
    cb.checked = task.done;
    cb.setAttribute("aria-label", task.text);
    li.querySelector(".text span").textContent = task.text;
    return li;
  }

  // keep a row in step with its task (after a change from the other device)
  function refreshItem(li, task) {
    li.classList.toggle("done", task.done);
    const cb = li.querySelector("input");
    cb.checked = task.done;
    cb.setAttribute("aria-label", task.text);
    const textEl = li.querySelector(".text");
    const span = textEl.querySelector("span");
    if (!textEl.isContentEditable && span && span.textContent !== task.text) span.textContent = task.text;
  }

  const find = (id) => state.items[id];
  const activeCount = () => state.tasks.filter(t => !t.done).length;
  const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const liOf = (id) => list.querySelector(`.task[data-id="${id}"]`);

  const maxOrder = (tasks) => tasks.reduce((m, t) => Math.max(m, t.o), -1);
  const minOrder = (tasks) => tasks.reduce((m, t) => Math.min(m, t.o), 1);

  // Give `task` an order value that puts it at its place in `ids` (its group, already reordered).
  // Only the moved task changes, so a reorder on one device merges cleanly with edits on the other.
  function placeAt(task, ids) {
    const i = ids.indexOf(task.id);
    const prev = ids[i - 1] && find(ids[i - 1]);
    const next = ids[i + 1] && find(ids[i + 1]);
    let o;
    if (prev && next) o = (prev.o + next.o) / 2;
    else if (prev) o = prev.o + 1;
    else if (next) o = next.o - 1;
    else o = 0;
    if (prev && next && !(o > prev.o && o < next.o)) {
      // ran out of room between the neighbours: renumber the whole group
      ids.forEach((id, k) => touch(find(id), { o: k }));
      return;
    }
    touch(task, { o });
  }

  const divider = document.createElement("li");
  divider.className = "divider";
  divider.setAttribute("aria-hidden", "true");
  divider.textContent = "Виконано";

  function snapshot() {
    const tops = new Map();
    for (const el of list.children) tops.set(el, el.getBoundingClientRect().top);
    return tops;
  }

  // Make the DOM match state.tasks. With `animate`, rows slide from where they were (FLIP).
  let syncTimer = null;
  function sync({ animate = false, from = null } = {}) {
    clearTimeout(syncTimer);
    syncTimer = null;
    const before = from || (animate ? snapshot() : null);

    const existing = new Map([...list.querySelectorAll(".task")].map(li => [li.dataset.id, li]));
    const rows = state.tasks.map(t => {
      let li = existing.get(t.id);
      if (li) refreshItem(li, t);
      else li = makeItem(t);
      existing.delete(t.id);
      return li;
    });
    existing.forEach(li => li.remove());

    const active = activeCount();
    const desired = rows.slice(0, active);
    if (active < rows.length) desired.push(divider);
    desired.push(...rows.slice(active));

    const current = [...list.children];
    if (desired.length !== current.length || desired.some((el, i) => el !== current[i])) {
      const focused = document.activeElement;
      list.replaceChildren(...desired);
      if (focused && list.contains(focused) && document.activeElement !== focused) focused.focus({ preventScroll: true });
    }

    if (before && !reducedMotion()) {
      for (const el of desired) {
        const old = before.get(el);
        if (old === undefined) {
          el.animate([{ opacity: 0, transform: "translateY(-4px)" }, { opacity: 1, transform: "none" }],
                     { duration: 180, easing: "ease-out" });
          continue;
        }
        const dy = old - el.getBoundingClientRect().top;
        if (Math.abs(dy) > 0.5) {
          el.animate([{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }],
                     { duration: 260, easing: "cubic-bezier(.2, .7, .2, 1)" });
        }
      }
    }
    renderProgress();
  }
  // run a delayed sync now (e.g. before a drag starts)
  function flushSync() {
    if (syncTimer) sync();
  }

  function announce(msg) {
    $("announce").textContent = msg;
  }

  function addTask(text) {
    flushSync();
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const task = { id, text, done: false, day: view };
    // end of the unfinished group, above finished ones
    touch(task, { o: maxOrder(state.tasks.filter(t => !t.done)) + 1 });
    state.items[id] = task;
    sync({ animate: true });
    liOf(task.id).scrollIntoView({ block: "nearest" });
    save();
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addTask(text);
    input.value = "";
    addBtn.disabled = true;
    input.focus();
  });
  input.addEventListener("input", () => { addBtn.disabled = !input.value.trim(); });

  list.addEventListener("change", (e) => {
    if (e.target.type !== "checkbox") return;
    const li = e.target.closest(".task");
    const task = find(li.dataset.id);
    const done = e.target.checked;
    li.classList.toggle("done", done);

    // Done → top of the finished group; undone → end of the unfinished group.
    const before = game;
    const others = state.tasks.filter(t => t !== task && t.done === done);
    touch(task, { done, doneAt: done ? Date.now() : null, o: done ? minOrder(others) - 1 : maxOrder(others) + 1 });
    renderProgress();
    if (done) {
      if (game.xp > before.xp) floatXp(li, game.xp - before.xp);
      const closed = game.bonusDays.has(task.day) && !before.bonusDays.has(task.day);
      celebrate(closed ? [`День закрито · +${XP.day} XP`] : []);
    }
    save();

    // let the strike-through finish before the row slides away
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => sync({ animate: true }), reducedMotion() ? 0 : 380);
  });

  list.addEventListener("click", (e) => {
    const del = e.target.closest(".del");
    if (!del) return;
    flushSync();
    const li = del.closest(".task");
    const siblings = [...list.querySelectorAll(".task")];
    const i = siblings.indexOf(li);
    const next = siblings[i + 1] || siblings[i - 1];
    touch(find(li.dataset.id), { deleted: true });
    sync({ animate: true });
    (next ? next.querySelector("input") : input).focus();
    save();
  });

  // ---------- reorder: drag the grip ----------
  // Rows only move within their own group (unfinished / finished).
  let drag = null;

  function groupRows(task) {
    return [...list.querySelectorAll(".task")].filter(li => find(li.dataset.id).done === task.done);
  }

  list.addEventListener("pointerdown", (e) => {
    const grip = e.target.closest(".grip");
    if (!grip || e.button !== 0 || drag) return;
    e.preventDefault();
    flushSync();

    const li = grip.closest(".task");
    const task = find(li.dataset.id);
    const rows = groupRows(task);
    const last = rows[rows.length - 1];
    drag = {
      li, task, rows, grip,
      from: rows.indexOf(li),
      to: rows.indexOf(li),
      grabOffset: e.clientY - list.getBoundingClientRect().top - li.offsetTop,
      shift: li.offsetHeight + 2,
      minTop: rows[0].offsetTop,
      maxTop: last.offsetTop + last.offsetHeight - li.offsetHeight,
      y: e.clientY,
      moved: false,
      raf: 0,
    };
    try { grip.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
    li.classList.add("dragging");
    document.body.classList.add("is-dragging");
    rows.forEach(r => r !== li && r.classList.add("shifting"));
    drag.raf = requestAnimationFrame(autoScroll);
  });

  function updateDrag() {
    const { li, rows, from } = drag;
    const listTop = list.getBoundingClientRect().top;
    const top = Math.min(drag.maxTop, Math.max(drag.minTop, drag.y - listTop - drag.grabOffset));
    li.style.transform = `translateY(${top - li.offsetTop}px)`;

    const center = top + li.offsetHeight / 2;
    let to = 0;
    for (const r of rows) {
      if (r !== li && r.offsetTop + r.offsetHeight / 2 < center) to++;
    }
    rows.forEach((r, i) => {
      if (r === li) return;
      let dy = 0;
      if (i > from && i <= to) dy = -drag.shift;
      else if (i < from && i >= to) dy = drag.shift;
      r.style.transform = dy ? `translateY(${dy}px)` : "";
    });
    drag.to = to;
  }

  // keep the list scrolling while the row is held near the top/bottom edge
  function autoScroll() {
    if (!drag) return;
    const main = list.parentElement;
    const r = main.getBoundingClientRect();
    const edge = 40;
    let speed = 0;
    if (drag.y < r.top + edge) speed = -Math.ceil((r.top + edge - drag.y) / 4);
    else if (drag.y > r.bottom - edge) speed = Math.ceil((drag.y - (r.bottom - edge)) / 4);
    if (speed && drag.moved) {
      main.scrollTop += speed;
      updateDrag();
    }
    drag.raf = requestAnimationFrame(autoScroll);
  }

  list.addEventListener("pointermove", (e) => {
    if (!drag) return;
    drag.y = e.clientY;
    drag.moved = true;
    updateDrag();
  });

  function endDrag() {
    if (!drag) return;
    const { li, rows, from, to, task } = drag;
    cancelAnimationFrame(drag.raf);
    drag = null;

    const before = snapshot(); // visual positions, transforms included
    rows.forEach(r => { r.classList.remove("shifting"); r.style.transform = ""; });
    document.body.classList.remove("is-dragging");

    const ids = rows.map(r => r.dataset.id);
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    if (from !== to) placeAt(task, ids);
    sync({ animate: true, from: before });
    setTimeout(() => li.classList.remove("dragging"), reducedMotion() ? 0 : 200);

    if (from !== to) {
      announce(`Переміщено на позицію ${to + 1} з ${ids.length}`);
      save();
    }
  }
  list.addEventListener("pointerup", endDrag);
  list.addEventListener("pointercancel", endDrag);
  list.addEventListener("lostpointercapture", endDrag);

  // ---------- reorder: keyboard (↑/↓ on the grip, Alt+↑/↓ anywhere in the row) ----------
  list.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    const onGrip = e.target.classList.contains("grip");
    if (!onGrip && !e.altKey) return;
    if (e.target.isContentEditable) return;
    const li = e.target.closest(".task");
    if (!li || drag) return;
    e.preventDefault();
    flushSync();

    const task = find(li.dataset.id);
    const ids = groupRows(task).map(r => r.dataset.id);
    const from = ids.indexOf(task.id);
    const to = from + (e.key === "ArrowUp" ? -1 : 1);
    if (to < 0 || to >= ids.length) return;
    ids.splice(to, 0, ids.splice(from, 1)[0]);
    placeAt(task, ids);
    sync({ animate: true });
    e.target.focus({ preventScroll: true });
    li.scrollIntoView({ block: "nearest" });
    announce(`Позиція ${to + 1} з ${ids.length}`);
    save();
  });

  // ---------- inline edit ----------
  function startEdit(textEl) {
    if (textEl.isContentEditable) return;
    const li = textEl.closest(".task");
    const task = find(li.dataset.id);
    textEl.textContent = task.text;
    textEl.contentEditable = "true";
    textEl.focus();
    const range = document.createRange();
    range.selectNodeContents(textEl);
    range.collapse(false);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);

    const finish = (commit) => {
      textEl.removeEventListener("blur", onBlur);
      textEl.removeEventListener("keydown", onKey);
      textEl.contentEditable = "false";
      const value = textEl.textContent.replace(/\s+/g, " ").trim();
      const task = find(li.dataset.id); // the object may have been replaced by a sync meanwhile
      if (commit && value && value !== task.text) touch(task, { text: value });
      textEl.innerHTML = "";
      const span = document.createElement("span");
      span.textContent = task.text;
      textEl.append(span);
      li.querySelector("input").setAttribute("aria-label", task.text);
      save();
    };
    const onBlur = () => finish(true);
    const onKey = (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
    };
    textEl.addEventListener("blur", onBlur);
    textEl.addEventListener("keydown", onKey);
  }
  list.addEventListener("dblclick", (e) => {
    const t = e.target.closest(".text");
    if (t) startEdit(t);
  });

  $("clearBtn").addEventListener("click", () => {
    flushSync();
    state.tasks.filter(t => t.done).forEach(t => touch(t, { deleted: true }));
    sync({ animate: true });
    save();
    input.focus();
  });

  // ---------- days ----------
  function goTo(key) {
    if (key === view) return;
    const dir = Math.sign(dayDiff(key, view));
    if (list.contains(document.activeElement)) document.activeElement.blur(); // commits an open edit
    flushSync();
    view = key;
    sync();
    renderHeader();
    if (!reducedMotion()) {
      for (const el of [list, $("empty")]) {
        el.animate([{ opacity: 0, transform: `translateX(${dir * 14}px)` }, { opacity: 1, transform: "none" }],
                   { duration: 200, easing: "cubic-bezier(.2, .7, .2, 1)" });
      }
    }
  }

  $("prevDay").addEventListener("click", () => goTo(addDays(view, -1)));
  $("nextDay").addEventListener("click", () => goTo(addDays(view, 1)));
  $("todayBtn").addEventListener("click", () => { goTo(today); input.focus(); });

  document.addEventListener("keydown", (e) => {
    if (!e.altKey || $("cal").hidden === false) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); goTo(addDays(view, -1)); }
    if (e.key === "ArrowRight") { e.preventDefault(); goTo(addDays(view, 1)); }
  });

  // unfinished tasks of a past day → end of today's unfinished group
  $("carryBtn").addEventListener("click", () => {
    flushSync();
    const moving = state.tasks.filter(t => !t.done);
    const start = maxOrder(dayTasks(today).filter(t => !t.done)) + 1;
    moving.forEach((t, i) => touch(t, { day: today, o: start + i }));
    sync({ animate: true });
    announce(`Перенесено на сьогодні: ${moving.length}`);
    save();
  });

  // ---------- calendar ----------
  const cal = $("cal"), calGrid = $("calGrid"), dateBtn = $("dateBtn");
  let calMonth = null; // first day of the shown month, as a key
  let calFocus = null; // day that holds keyboard focus inside the grid
  let calPick = null;  // task id while choosing a day to move it to

  const monthStart = (key) => key.slice(0, 8) + "01";
  const WEEKDAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];

  function renderCalendar() {
    const first = dateOf(calMonth);
    $("calTitle").textContent = `${cap(first.toLocaleDateString("uk-UA", { month: "long" }))} ${first.getFullYear()}`;

    const cells = WEEKDAYS.map(w => {
      const el = document.createElement("div");
      el.className = "cal-wd";
      el.textContent = w;
      el.setAttribute("aria-hidden", "true");
      return el;
    });

    const perDay = {}; // day → { total, done }
    for (const t of Object.values(state.items)) {
      if (t.deleted) continue;
      const c = (perDay[t.day] ||= { total: 0, done: 0 });
      c.total++;
      if (t.done) c.done++;
    }

    const offset = (first.getDay() + 6) % 7; // weeks start on Monday
    let key = addDays(calMonth, -offset);
    for (let i = 0; i < 42; i++, key = addDays(key, 1)) {
      const d = dateOf(key);
      const { total, done } = perDay[key] || { total: 0, done: 0 };
      const b = document.createElement("button");
      b.type = "button";
      b.className = "cal-day";
      b.dataset.key = key;
      b.textContent = d.getDate();
      b.tabIndex = key === calFocus ? 0 : -1;
      b.classList.toggle("out", key.slice(0, 7) !== calMonth.slice(0, 7));
      b.classList.toggle("today", key === today);
      b.classList.toggle("selected", key === view);
      b.classList.toggle("has", total > 0);
      b.classList.toggle("all-done", total > 0 && done === total);
      // the task is already there; stays focusable so arrow keys can pass over it
      if (calPick && key === find(calPick).day) b.setAttribute("aria-disabled", "true");
      let label = cap(d.toLocaleDateString("uk-UA", { weekday: "long", day: "numeric", month: "long" }));
      if (total) label += `, ${total} ${tasksWord(total)}, виконано ${done}`;
      b.setAttribute("aria-label", label);
      if (key === view) b.setAttribute("aria-current", "date");
      cells.push(b);
    }
    calGrid.replaceChildren(...cells);
  }

  function focusCalDay(key) {
    calFocus = key;
    if (monthStart(key) !== calMonth) calMonth = monthStart(key);
    renderCalendar();
    calGrid.querySelector(`[data-key="${key}"]`).focus();
  }

  // pickFor: id of a task to move — the calendar then picks its new day instead of navigating
  function openCalendar(pickFor = null) {
    closeSyncPanel(false);
    closeProfile(false);
    calPick = pickFor;
    const hint = $("calHint");
    hint.hidden = !pickFor;
    if (pickFor) {
      hint.replaceChildren("Перенести «", el("strong", { textContent: find(pickFor).text }), "» на…");
      hint.title = find(pickFor).text;
    }
    calFocus = pickFor ? addDays(view, 1) : view;
    calMonth = monthStart(calFocus);
    renderCalendar();
    cal.style.top = `${document.querySelector("header").getBoundingClientRect().bottom - 6}px`;
    cal.hidden = false;
    dateBtn.setAttribute("aria-expanded", "true");
    if (!reducedMotion()) {
      cal.animate([{ opacity: 0, transform: "translateY(-6px)" }, { opacity: 1, transform: "none" }],
                  { duration: 160, easing: "ease-out" });
    }
    calGrid.querySelector(`[data-key="${calFocus}"]`).focus();
  }

  function closeCalendar(returnFocus = true) {
    if (cal.hidden) return;
    cal.hidden = true;
    dateBtn.setAttribute("aria-expanded", "false");
    if (returnFocus) {
      // back to the row's move button if we were picking a day for it
      const back = calPick && liOf(calPick) && liOf(calPick).querySelector(".move");
      (back || dateBtn).focus();
    }
    calPick = null;
  }

  dateBtn.addEventListener("click", () => (cal.hidden || calPick ? openCalendar() : closeCalendar()));

  calGrid.addEventListener("click", (e) => {
    const b = e.target.closest(".cal-day");
    if (!b || b.getAttribute("aria-disabled") === "true") return;
    if (calPick) {
      const id = calPick;
      calPick = null;
      closeCalendar(false);
      moveTask(id, b.dataset.key);
      return;
    }
    goTo(b.dataset.key);
    closeCalendar(false);
    input.focus();
  });

  const shiftMonth = (n) => {
    const d = dateOf(calMonth);
    d.setMonth(d.getMonth() + n);
    calMonth = keyOf(d);
    // keep the roving focus inside the shown month
    const day = Math.min(dateOf(calFocus).getDate(), new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
    calFocus = calMonth.slice(0, 8) + pad(day);
    renderCalendar();
  };
  $("calPrev").addEventListener("click", () => shiftMonth(-1));
  $("calNext").addEventListener("click", () => shiftMonth(1));

  cal.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closeCalendar(); return; }
    if (!e.target.classList.contains("cal-day")) return;
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (step) { e.preventDefault(); focusCalDay(addDays(calFocus, step)); }
    if (e.key === "PageUp" || e.key === "PageDown") {
      e.preventDefault();
      shiftMonth(e.key === "PageUp" ? -1 : 1);
      calGrid.querySelector(`[data-key="${calFocus}"]`).focus();
    }
  });

  // click outside closes it
  document.addEventListener("pointerdown", (e) => {
    if (!cal.hidden && !cal.contains(e.target) && !dateBtn.contains(e.target)) closeCalendar(false);
  });

  // ---------- move a task to another day ----------
  const moveMenu = $("moveMenu");
  let menuFor = null; // { id, button }

  // "tomorrow" for today's and past tasks; the following day for tasks already planned ahead
  const nextDayFor = (task) => addDays(task.day < today ? today : task.day, 1);

  function relativeDay(key) {
    const rel = { 0: "сьогодні", 1: "завтра", 2: "післязавтра" }[dayDiff(key, today)];
    return rel || dateOf(key).toLocaleDateString("uk-UA", { weekday: "short", day: "numeric", month: "long" });
  }

  function openMoveMenu(li, button) {
    closeMoveMenu(false);
    const task = find(li.dataset.id);
    const next = nextDayFor(task);
    $("moveNextLabel").textContent = dayDiff(next, today) === 1 ? "На завтра" : "На наступний день";
    $("moveNextDate").textContent = dateOf(next).toLocaleDateString("uk-UA", { weekday: "short", day: "numeric", month: "short" });
    menuFor = { id: task.id, button };
    button.setAttribute("aria-expanded", "true");

    // under the button, right-aligned to it, flipped up if there's no room below
    moveMenu.hidden = false;
    const b = button.getBoundingClientRect(), m = moveMenu.getBoundingClientRect();
    const below = b.bottom + 4 + m.height <= innerHeight - 8;
    moveMenu.style.top = `${below ? b.bottom + 4 : b.top - 4 - m.height}px`;
    moveMenu.style.left = `${Math.max(8, Math.min(b.right - m.width, innerWidth - m.width - 8))}px`;
    $("moveNext").focus();
  }

  function closeMoveMenu(returnFocus = true) {
    if (!menuFor) return;
    moveMenu.hidden = true;
    menuFor.button.setAttribute("aria-expanded", "false");
    if (returnFocus) menuFor.button.focus();
    menuFor = null;
  }

  list.addEventListener("click", (e) => {
    const btn = e.target.closest(".move");
    if (!btn) return;
    if (menuFor && menuFor.button === btn) closeMoveMenu();
    else openMoveMenu(btn.closest(".task"), btn);
  });

  $("moveNext").addEventListener("click", () => {
    const id = menuFor.id;
    closeMoveMenu(false);
    moveTask(id, nextDayFor(find(id)));
  });
  $("movePick").addEventListener("click", () => {
    const id = menuFor.id;
    closeMoveMenu(false);
    openCalendar(id);
  });

  moveMenu.addEventListener("keydown", (e) => {
    const items = [...moveMenu.querySelectorAll("button")];
    const i = items.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); closeMoveMenu(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
    }
    if (e.key === "Tab") closeMoveMenu(false);
  });
  document.addEventListener("pointerdown", (e) => {
    if (menuFor && !moveMenu.contains(e.target) && !menuFor.button.contains(e.target)) closeMoveMenu(false);
  });
  list.parentElement.addEventListener("scroll", () => closeMoveMenu(false));

  function moveTask(id, day) {
    flushSync();
    const task = find(id);
    if (!task || task.day === day) return;
    // keep its done state; it goes to the end of its group on the new day
    const o = maxOrder(dayTasks(day).filter(t => t.done === task.done)) + 1;
    const li = liOf(id);
    const siblings = [...list.querySelectorAll(".task")];
    const next = li && (siblings[siblings.indexOf(li) + 1] || siblings[siblings.indexOf(li) - 1]);

    // the data changes and is saved right away; only the row's exit is animated
    touch(task, { day, o });
    save();
    showToast(`Перенесено на ${relativeDay(day)}`, { label: "Показати", run: () => goTo(day) });
    (next ? next.querySelector(".move") || next.querySelector("input") : input).focus({ preventScroll: true });

    const done = () => sync({ animate: true });
    if (li && !reducedMotion()) {
      li.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(24px)" }],
                 { duration: 180, easing: "ease-in", fill: "forwards" });
      clearTimeout(syncTimer);
      syncTimer = setTimeout(done, 180);
    } else {
      done();
    }
  }

  // ---------- toast ----------
  // action: { label, run } for the button on the right, or null for none
  let toastTimer = null, toastAction = null;
  function showToast(text, action = null) {
    $("toastText").textContent = text;
    toastAction = action;
    $("toastAction").hidden = !action;
    if (action) $("toastAction").textContent = action.label;
    const toast = $("toast");
    toast.hidden = false;
    if (!reducedMotion()) {
      toast.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }],
                    { duration: 180, easing: "ease-out" });
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 5000);
  }
  $("toastAction").addEventListener("click", () => {
    $("toast").hidden = true;
    if (toastAction) toastAction.run();
  });

  // ---------- progress: XP, levels, streaks, achievements ----------
  // Everything is worked out from the tasks themselves, so it syncs along with them and
  // un-ticking a task takes its XP back. A finished task keeps counting after it is cleared.
  const XP = { task: 10, onTime: 5, day: 25 }; // per task, extra if done by its day, per closed day
  const CLOSED_MIN = 3;                          // a closed day needs at least this many tasks
  const levelNeed = (level) => 100 + 25 * (level - 1); // XP from `level` to the next one
  const RANKS = [
    { min: 1, icon: "🌱", name: "Новачок" },
    { min: 3, icon: "🌿", name: "Учень" },
    { min: 6, icon: "🌳", name: "Трудяга" },
    { min: 10, icon: "⚔️", name: "Майстер справ" },
    { min: 15, icon: "🛡️", name: "Ветеран" },
    { min: 20, icon: "🔮", name: "Гуру продуктивності" },
    { min: 30, icon: "👑", name: "Легенда" },
  ];
  const rankOf = (level) => RANKS.filter(r => r.min <= level).pop();
  const ACHIEVEMENTS = [
    { id: "first",    icon: "🌱", name: "Перший крок",        desc: "Виконати першу задачу",                 goal: 1,    val: g => g.total },
    { id: "done10",   icon: "✋", name: "Розігрів",           desc: "Виконати 10 задач",                     goal: 10,   val: g => g.total },
    { id: "done50",   icon: "💪", name: "Півсотні",           desc: "Виконати 50 задач",                     goal: 50,   val: g => g.total },
    { id: "done100",  icon: "💯", name: "Сотня",              desc: "Виконати 100 задач",                    goal: 100,  val: g => g.total },
    { id: "done500",  icon: "⚙️", name: "Машина",             desc: "Виконати 500 задач",                    goal: 500,  val: g => g.total },
    { id: "done1000", icon: "🏔️", name: "Тисячник",           desc: "Виконати 1000 задач",                   goal: 1000, val: g => g.total },
    { id: "streak3",  icon: "🔥", name: "Іскра",              desc: "3 дні поспіль з виконаними задачами",   goal: 3,    val: g => g.bestStreak },
    { id: "streak7",  icon: "🔥", name: "Тиждень у вогні",    desc: "7 днів поспіль з виконаними задачами",  goal: 7,    val: g => g.bestStreak },
    { id: "streak30", icon: "☄️", name: "Місяць без перерви", desc: "30 днів поспіль з виконаними задачами", goal: 30,   val: g => g.bestStreak },
    { id: "closed1",  icon: "✅", name: "Чистий аркуш",       desc: `Закрити день: виконати всі задачі дня (від ${CLOSED_MIN})`, goal: 1, val: g => g.bonusDays.size },
    { id: "closed10", icon: "🎯", name: "Перфекціоніст",      desc: "Закрити 10 днів",                       goal: 10,   val: g => g.bonusDays.size },
    { id: "week",     icon: "🗓️", name: "Ідеальний тиждень",  desc: "7 днів поспіль без невиконаних задач",  goal: 7,    val: g => g.bestClearRun },
    { id: "busy",     icon: "⚡", name: "Продуктивний день",  desc: "Виконати 10 задач за один день",        goal: 10,   val: g => g.maxPerDay },
    { id: "ahead",    icon: "⏩", name: "Наперед",            desc: "Виконати 5 задач раніше їхнього дня",   goal: 5,    val: g => g.ahead },
    { id: "early",    icon: "🌅", name: "Рання пташка",       desc: "Виконати задачу до 9:00",               goal: 1,    val: g => g.early },
    { id: "night",    icon: "🦉", name: "Нічна сова",         desc: "Виконати задачу після 23:00",           goal: 1,    val: g => g.night },
    { id: "lvl10",    icon: "⭐", name: "Десятка",            desc: "Досягти 10 рівня",                      goal: 10,   val: g => g.level },
  ];
  const WEEKDAY_NAMES = ["неділя", "понеділок", "вівторок", "середа", "четвер", "пʼятниця", "субота"];
  const HEAT_WEEKS = 17;

  // longest run of consecutive days among `days` (keys)
  function longestRun(days) {
    let best = 0, run = 0, prev = null;
    for (const d of [...days].sort()) {
      run = prev && addDays(prev, 1) === d ? run + 1 : 1;
      best = Math.max(best, run);
      prev = d;
    }
    return best;
  }

  function computeGame() {
    const perDay = {}; // planned day → { total, done }
    const doneOn = {}; // day a task was ticked → how many
    const weekdays = [0, 0, 0, 0, 0, 0, 0];
    let total = 0, onTime = 0, ahead = 0, early = 0, night = 0;
    for (const t of Object.values(state.items)) {
      if (t.deleted && !t.done) continue;
      const c = (perDay[t.day] ||= { total: 0, done: 0 });
      c.total++;
      if (!t.done) continue;
      c.done++;
      total++;
      const at = t.doneAt ? new Date(t.doneAt) : null; // ticked before this update: count it on its own day
      const day = at ? keyOf(at) : t.day;
      doneOn[day] = (doneOn[day] || 0) + 1;
      weekdays[dateOf(day).getDay()]++;
      if (day <= t.day) onTime++;
      if (day < t.day) ahead++;
      if (at) {
        const h = at.getHours();
        if (h >= 4 && h < 9) early++;
        if (h >= 23 || h < 4) night++;
      }
    }

    // a clear day: everything planned for it is done; a closed day also has enough tasks to earn the bonus
    const clear = new Set(), bonusDays = new Set();
    for (const [day, c] of Object.entries(perDay)) {
      if (day > today || c.done < c.total) continue;
      clear.add(day);
      if (c.total >= CLOSED_MIN) bonusDays.add(day);
    }

    const xp = total * XP.task + onTime * XP.onTime + bonusDays.size * XP.day;
    let level = 1, into = xp;
    while (into >= levelNeed(level)) { into -= levelNeed(level); level++; }

    // the streak is still alive today until midnight, even before the first task of the day
    let streak = 0;
    for (let d = doneOn[today] ? today : addDays(today, -1); doneOn[d]; d = addDays(d, -1)) streak++;

    const g = {
      xp, level, into, need: levelNeed(level), total, ahead, early, night, doneOn, weekdays, bonusDays,
      streak, bestStreak: longestRun(Object.keys(doneOn)), bestClearRun: longestRun(clear),
      maxPerDay: Math.max(0, ...Object.values(doneOn)),
    };
    g.unlocked = ACHIEVEMENTS.filter(a => a.val(g) >= a.goal).map(a => a.id);
    return g;
  }

  const lvlBtn = $("lvlBtn"), profilePanel = $("profilePanel");
  const num = (n) => n.toLocaleString("uk-UA");
  let game = null;

  function renderGame() {
    game = computeGame();
    if (!state.seen) markSeen(); // first run with levels: nothing to celebrate yet
    const r = rankOf(game.level);
    $("lvlAvatar").textContent = r.icon;
    $("lvlText").textContent = `Рів. ${game.level}`;
    $("lvlStreak").hidden = !game.streak;
    $("lvlStreak").textContent = `🔥${game.streak}`;
    lvlBtn.style.setProperty("--p", game.into / game.need);
    lvlBtn.title = `${r.name} · ${game.into} / ${game.need} XP до рівня ${game.level + 1}`;
    lvlBtn.setAttribute("aria-label",
      `Профіль: рівень ${game.level}, ${game.into} з ${game.need} XP` + (game.streak ? `, серія ${game.streak} дн.` : ""));
    if (!profilePanel.hidden) renderProfile();
  }

  function markSeen() {
    const seen = state.seen || { level: 0, ach: [] };
    state.seen = { level: Math.max(seen.level, game.level), ach: [...new Set([...seen.ach, ...game.unlocked])] };
  }

  // after ticking a task here: toast + confetti for a new level or achievement
  function celebrate(notes) {
    const newAch = ACHIEVEMENTS.filter(a => game.unlocked.includes(a.id) && !state.seen.ach.includes(a.id));
    const levelUp = game.level > state.seen.level;
    markSeen();
    if (levelUp) notes.unshift(`${rankOf(game.level).icon} Новий рівень: ${game.level}!`);
    newAch.slice(0, 2).forEach(a => notes.push(`${a.icon} «${a.name}»`));
    if (newAch.length > 2) notes.push(`і ще ${newAch.length - 2}`);
    if (!notes.length) return;
    showToast(notes.join(" · "), { label: "Профіль", run: openProfile });
    if (levelUp || newAch.length) confetti(lvlBtn);
  }

  function floatXp(row, amount) {
    if (reducedMotion()) return;
    const r = row.getBoundingClientRect();
    const tag = el("span", { className: "xp-float", textContent: `+${amount} XP` });
    tag.style.left = `${r.right - 64}px`;
    tag.style.top = `${r.top + r.height / 2 - 9}px`;
    document.body.append(tag);
    tag.animate([
      { opacity: 0, transform: "translateY(4px)" },
      { opacity: 1, transform: "translateY(-4px)", offset: .2 },
      { opacity: 0, transform: "translateY(-24px)" },
    ], { duration: 1000, easing: "ease-out" }).onfinish = () => tag.remove();
  }

  function confetti(from) {
    if (reducedMotion()) return;
    const r = from.getBoundingClientRect();
    const colors = ["var(--primary)", "var(--accent)", "#F5B301", "#7C5CFF", "#E5487A"];
    for (let i = 0; i < 28; i++) {
      const bit = el("i", { className: "confetti" });
      bit.style.left = `${r.left + r.width / 2}px`;
      bit.style.top = `${r.top + r.height / 2}px`;
      bit.style.background = colors[i % colors.length];
      document.body.append(bit);
      const dx = (Math.random() - .5) * 240, rise = 10 + Math.random() * 40, fall = 140 + Math.random() * 120;
      const spin = (Math.random() - .5) * 720;
      bit.animate([
        { transform: "translate(0, 0) rotate(0)", opacity: 1 },
        { transform: `translate(${dx * .6}px, ${rise}px) rotate(${spin / 2}deg)`, opacity: 1, offset: .3 },
        { transform: `translate(${dx}px, ${fall}px) rotate(${spin}deg)`, opacity: 0 },
      ], { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.2, .6, .4, 1)" }).onfinish = () => bit.remove();
    }
  }

  function renderProfile() {
    const g = game, r = rankOf(g.level), next = RANKS.find(x => x.min > g.level);
    const fill = el("div", { className: "xp-fill" });
    fill.style.transform = `scaleX(${g.into / g.need})`;
    const top = el("div", { className: "profile-top" },
      el("div", { className: "avatar", textContent: r.icon }),
      el("div", { className: "info" },
        el("div", { className: "rank", textContent: r.name }),
        el("div", { className: "lvl-line" },
          el("span", { textContent: `Рівень ${g.level}` }),
          el("span", { textContent: `${num(g.into)} / ${num(g.need)} XP` })),
        el("div", { className: "xp-track" }, fill)));

    const best = g.total ? g.weekdays.indexOf(Math.max(...g.weekdays)) : -1;
    const stat = (value, label) => el("div", { className: "stat" }, el("b", { textContent: value }), el("span", { textContent: label }));
    const stats = el("div", { className: "stats" },
      stat(num(g.total), "задач виконано"),
      stat(`🔥 ${g.streak}`, `серія днів · рекорд ${g.bestStreak}`),
      stat(num(g.bonusDays.size), "закритих днів"),
      stat(best < 0 ? "—" : cap(WEEKDAY_NAMES[best]), "найпродуктивніший день"));

    // heatmap: HEAT_WEEKS columns, Monday to Sunday, ending with the current week
    const start = addDays(today, -((dateOf(today).getDay() + 6) % 7) - (HEAT_WEEKS - 1) * 7);
    const cells = [];
    let inRange = 0;
    for (let i = 0, d = start; i < HEAT_WEEKS * 7; i++, d = addDays(d, 1)) {
      const n = g.doneOn[d] || 0;
      inRange += n;
      const cell = el("i");
      if (d > today) cell.className = "future";
      else {
        if (n) cell.className = n === 1 ? "l1" : n <= 3 ? "l2" : n <= 5 ? "l3" : "l4";
        if (d === today) cell.classList.add("today");
        cell.title = `${dayMonth(d)}: ${n} ${tasksWord(n)}`;
      }
      cells.push(cell);
    }
    const heat = el("div", { className: "heat" }, ...cells);
    heat.setAttribute("role", "img");
    heat.setAttribute("aria-label", `Активність за ${HEAT_WEEKS} тижнів: виконано ${inRange} ${tasksWord(inRange)}`);
    const legend = el("div", { className: "heat-legend" }, el("span", { textContent: "менше" }),
      el("i"), el("i", { className: "l1" }), el("i", { className: "l2" }), el("i", { className: "l3" }), el("i", { className: "l4" }),
      el("span", { textContent: "більше" }));
    legend.setAttribute("aria-hidden", "true");

    const achs = ACHIEVEMENTS.map(a => {
      const got = g.unlocked.includes(a.id);
      const note = got || a.goal === 1 ? a.desc : `${a.desc} · ${Math.min(a.val(g), a.goal)} / ${a.goal}`;
      return el("div", { className: got ? "ach" : "ach locked" },
        el("span", { className: "ico", textContent: a.icon }),
        el("div", {}, el("b", { textContent: a.name }), el("small", { textContent: note })));
    });

    $("profileBody").replaceChildren(
      top,
      el("p", { className: "xp-hint", textContent: next
        ? `Усього ${num(g.xp)} XP. Звання «${next.name}» — з ${next.min} рівня.`
        : `Усього ${num(g.xp)} XP. Найвище звання здобуто!` }),
      stats,
      el("div", { className: "section-title" }, "Активність", el("span", { textContent: `${num(inRange)} за ${HEAT_WEEKS} тиж.` })),
      heat, legend,
      el("div", { className: "section-title" }, "Досягнення", el("span", { textContent: `${g.unlocked.length} / ${ACHIEVEMENTS.length}` })),
      el("div", { className: "ach-list" }, ...achs),
      el("p", { className: "xp-hint",
        textContent: `XP: +${XP.task} за задачу, +${XP.onTime} якщо виконано вчасно, +${XP.day} за закритий день (усі задачі дня, від ${CLOSED_MIN}).` }));
  }

  function openProfile() {
    closeCalendar(false);
    closeMoveMenu(false);
    closeSyncPanel(false);
    const top = document.querySelector(".bar").getBoundingClientRect().bottom + 2;
    profilePanel.style.top = `${top}px`;
    profilePanel.style.setProperty("--panel-top", `${top}px`);
    profilePanel.hidden = false;
    lvlBtn.setAttribute("aria-expanded", "true");
    renderProfile();
    profilePanel.scrollTop = 0;
    if (!reducedMotion()) {
      profilePanel.animate([{ opacity: 0, transform: "translateY(-6px)" }, { opacity: 1, transform: "none" }],
                           { duration: 160, easing: "ease-out" });

  }
  function closeProfile(returnFocus = true) {
    if (profilePanel.hidden) return;
    profilePanel.hidden = true;
    lvlBtn.setAttribute("aria-expanded", "false");
